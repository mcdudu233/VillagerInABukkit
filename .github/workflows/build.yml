name: Build
on:
  push:
    branches: [ master ]
    paths:
      - "src/**"
      - "resourcepack/**"
      - "settings.gradle.kts"
      - ".github/workflows/build.yml"
      - "LICENSE"
      - "build.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
      - name: Build with gradle
        run: ./gradlew clean shadowJar resourcePackZip -PbuildWithoutGitHash
      - name: Upload plugin and resource pack
        uses: actions/upload-artifact@v4
        with:
          name: VillagerInABukkit-Paper-26.3
          path: |
            build/libs/VillagerInABukkit-paper-*.jar
            build/distributions/VillagerInABukkitPack-*.zip