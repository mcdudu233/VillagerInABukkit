# 控制发射器能否装起或放出这三类生物。玩家的操作由权限控制。
dispenser:
  villager:
    pickup: true
    place: true
  wandering-trader:
    pickup: true
    place: true
  zombie-villager:
    pickup: true
    place: true

# 玩家可以将配套 ZIP 放入客户端的 resourcepacks 文件夹并启用。
# 若要在玩家进服时自动发送，请先上传 ZIP，再填好下载直链和 SHA-1 并启用此项。
resource-pack: false

# 玩家可直接下载 ZIP 的 HTTPS 地址
# resource-pack-url: "https://example.com/VillagerInABukkitPack.zip"
# ZIP 文件的 SHA-1 值
# resource-pack-hash: ""
# 资源包的唯一标识，通常使用默认值即可
# resource-pack-id: "68a4b411-e409-4d89-b563-66049ba4914b"

# 是否将装起和放出村民的操作写入控制台
console-logging: false
# 是否将这些操作另存到 villager-actions.log
file-logging: false
