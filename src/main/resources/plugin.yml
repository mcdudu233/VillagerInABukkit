name: ${name}
main: com.imjustdoom.villagerinabucket.VillagerInABucket
version: ${version}
api-version: '26.3'
description: 村民装起来，让你用桶装起并搬运村民、僵尸村民和流浪商人。
author: JustDoom
website: https://imjustdoom.com
folia-supported: true
softdepend: [ BetterReload, WorldGuard, GriefPrevention ]

permissions:
  villagerinabucket.commands:
    default: op
    description: 允许使用村民装起来的管理命令。

  villagerinabucket.villager.pickup:
    default: true
    description: 允许用桶装起村民。
  villagerinabucket.zombie_villager.pickup:
    default: true
    description: 允许用桶装起僵尸村民。
  villagerinabucket.wandering_trader.pickup:
    default: true
    description: 允许用桶装起流浪商人。

  villagerinabucket.villager.place:
    default: true
    description: 允许从桶里放出村民。
  villagerinabucket.zombie_villager.place:
    default: true
    description: 允许从桶里放出僵尸村民。
  villagerinabucket.wandering_trader.place:
    default: true
    description: 允许从桶里放出流浪商人。

  villagerinabucket.harm-reputation:
    default: false
    description: 用桶装起村民时降低玩家的村民声望。